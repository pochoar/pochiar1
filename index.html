<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi experiencia WebAR</title>
  <meta name="description" content="Experiencia de realidad aumentada basada en imagen con MindAR.js">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui,-apple-system,sans-serif; background:#111; color:#fff; }
    #welcome { position:fixed; z-index:5; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:#111; }
    #welcome h1 { font-size:1.45rem; margin:0 0 12px; }
    #welcome p { max-width:34rem; line-height:1.5; color:#ddd; }
    #start { border:0; border-radius:12px; padding:14px 20px; font-size:1rem; font-weight:700; background:#fff; color:#111; }
    #status { position:fixed; z-index:6; bottom:18px; left:12px; right:12px; text-align:center; padding:10px 12px; border-radius:10px; background:#000b; color:#fff; font-size:.9rem; pointer-events:none; }
    a-scene { position:fixed; inset:0; }
    .a-enter-vr, .a-enter-ar { display:none !important; }
  </style>
</head>
<body>
  <div id="welcome">
    <h1>Experimenta la realidad aumentada</h1>
    <p>Permití el acceso a la cámara y apuntá hacia la imagen.</p>
    <button id="start">Iniciar cámara</button>
    <p style="font-size:.82rem">Requiere conexión a internet.</p>
  </div>
  <div id="status">Listo para iniciar</div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets>
      <video id="overlayVideo" src="./assets/video.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <img id="overlayImage" src="./assets/overlay.png" crossorigin="anonymous">
    </a-assets>

    <!-- targetIndex 0 corresponde a la primera imagen incluida al compilar target.mind.
         Ajustá width/height según la proporción de TU imagen. El ancho de referencia es 1. -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="videoPlane" src="#overlayVideo"
        position="0 0 0.01" rotation="0 0 0"
        width="1" height="0.5625" visible="true"></a-video>
      <a-plane id="imagePlane" src="#overlayImage"
        position="0 0 0.02" rotation="0 0 0"
        width="1" height="0.5625" visible="false"></a-plane>
    </a-entity>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <script src="./app.js"></script>
</body>
</html>
